name: Run Diretta Bot

on:
  schedule:
    - cron: "0 7 * * *"     # 07:00 italiane
    - cron: "30 23 * * *"   # 23:30 italiane
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # NECESSARIO per evitare errori di push

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps chromium

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TEAMS: ${{ secrets.TEAMS }}
        run: |
          python bot.py

      - name: Commit updated matches.json
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add matches.json
          git commit -m "Update matches" || echo "Nessuna modifica da commitare"

          # Aggiorna il branch locale prima del push
          git pull --rebase origin main

          # Push sicuro (evita errori e non sovrascrive commit tuoi)
          git push origin main --force-with-lease
